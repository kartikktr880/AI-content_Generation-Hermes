[project]
name = "ayce"
version = "0.0.1"
description = "AYCE — Autonomous YouTube Content & Video Production Engine (P0 foundation)"
requires-python = ">=3.12"
# pydantic (V2): canonical Scene Contract validation/modeling. Chosen by the
# completed Scene Manifest research as the contract technology; already present
# on the dev machine (2.12.5) — P0 remains stdlib-only apart from this.
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Real narration provider (P8): Kokoro-82M, executed LOCALLY (Apache-2.0
# weights from the official repo hexgrad/Kokoro-82M). This extra pulls the
# official runtime (torch/transformers/misaki[en], incl. espeakng-loader for
# non-English G2P). The base install stays stdlib+pydantic; without this
# extra the deterministic file-backed narration provider remains the default.
tts-kokoro = ["kokoro>=0.9.4,<0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: process-level tests (invoke the CLI as a subprocess)",
    "live: opt-in tests requiring external tooling configured via AYCE_* env (skipped otherwise)",
]

